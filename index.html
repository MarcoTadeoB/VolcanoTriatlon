<!DOCTYPE html>
<html lang="es" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0e12">
<title>Volcano Tri · Plan de entrenamiento</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* disciplinas — paleta validada para daltonismo y contraste */
  --swim:#1d8fd1; --bike:#d9a21b; --run:#e0384e; --gym:#8b5cf6; --brick:#10a37f;

  --font-ui:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --font-display:"Space Grotesk","Inter",-apple-system,"Segoe UI",Roboto,sans-serif;

  --bg:#eef1f5; --surface:#ffffff; --surface-2:#f2f4f8; --surface-3:#e8ebf1;
  --line:#e2e6ed; --line-2:#d3d9e3;
  --text:#0f1318; --text-2:#5b6472; --text-3:#8b94a4;
  --accent:#1d8fd1; --accent-2:#6d4df6; --on-accent:#fff;
  --ok:#0f8f66; --warn:#b4690e; --bad:#cf2b40;
  --soft:12%;
  --sh-1:0 1px 2px rgba(13,18,28,.05);
  --sh-2:0 2px 4px rgba(13,18,28,.04),0 8px 24px -8px rgba(13,18,28,.12);
  --sh-3:0 12px 40px -12px rgba(13,18,28,.28);
  --r:18px; --r-sm:12px; --r-xs:9px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bike:#bd8a12;
    --bg:#0c0e12; --surface:#16181d; --surface-2:#1e2128; --surface-3:#272b33;
    --line:#282c34; --line-2:#363b45;
    --text:#f2f4f7; --text-2:#a7aeba; --text-3:#767e8c;
    --accent:#3f9fdf; --accent-2:#8b6cff; --ok:#25b184; --warn:#d9a21b; --bad:#f0566c;
    --soft:20%;
    --sh-1:0 1px 2px rgba(0,0,0,.4);
    --sh-2:0 2px 4px rgba(0,0,0,.3),0 10px 28px -10px rgba(0,0,0,.6);
    --sh-3:0 16px 48px -14px rgba(0,0,0,.75);
    color-scheme:dark; }
}
:root[data-theme="dark"]{ --bike:#bd8a12;
  --bg:#0c0e12; --surface:#16181d; --surface-2:#1e2128; --surface-3:#272b33;
  --line:#282c34; --line-2:#363b45;
  --text:#f2f4f7; --text-2:#a7aeba; --text-3:#767e8c;
  --accent:#3f9fdf; --accent-2:#8b6cff; --ok:#25b184; --warn:#d9a21b; --bad:#f0566c;
  --soft:20%;
  --sh-1:0 1px 2px rgba(0,0,0,.4);
  --sh-2:0 2px 4px rgba(0,0,0,.3),0 10px 28px -10px rgba(0,0,0,.6);
  --sh-3:0 16px 48px -14px rgba(0,0,0,.75);
  color-scheme:dark; }

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font-family:var(--font-ui); font-size:15px; line-height:1.5;
  -webkit-text-size-adjust:100%; -webkit-font-smoothing:antialiased;
  font-feature-settings:"cv11","ss01";
  padding-bottom:env(safe-area-inset-bottom);
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.015em}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.dsp{font-family:var(--font-display);letter-spacing:-.02em}
.muted{color:var(--text-2)} .tiny{font-size:12.5px} .t3{color:var(--text-3)}
.row{display:flex;align-items:center;gap:10px} .wrap{flex-wrap:wrap} .spacer{flex:1}

/* ---------- barra superior ---------- */
.topbar{
  position:sticky;top:0;z-index:40;
  background:color-mix(in srgb,var(--surface) 82%,transparent);
  backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);
  border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:12px;padding:11px 18px;
  padding-top:calc(11px + env(safe-area-inset-top));
}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:700;
  font-size:16px;letter-spacing:-.03em}
.brand .dot{width:26px;height:26px;border-radius:9px;flex:none;position:relative;
  background:linear-gradient(140deg,var(--swim),var(--accent-2) 55%,var(--run));
  box-shadow:0 2px 8px -2px color-mix(in srgb,var(--accent) 60%,transparent)}
.brand .dot::after{content:"";position:absolute;inset:7px;border-radius:3px;background:var(--surface);opacity:.92}
.brand small{display:block;font-family:var(--font-ui);font-weight:500;font-size:11px;
  color:var(--text-3);letter-spacing:0}
.cd{text-align:right;line-height:1.1}
.cd b{font-family:var(--font-display);font-size:19px;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.cd small{display:block;font-size:10px;color:var(--text-3);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.icon-btn{background:var(--surface-2);border:1px solid var(--line);border-radius:11px;
  width:38px;height:38px;display:grid;place-items:center;font-size:15px;color:var(--text-2);
  transition:.15s border-color,.15s background,.15s color}
.icon-btn:hover{border-color:var(--line-2);color:var(--text);background:var(--surface-3)}
.icon-btn:disabled{opacity:.35;cursor:default}

/* ---------- navegación ---------- */
nav.tabs{position:sticky;top:61px;z-index:35;
  background:color-mix(in srgb,var(--surface) 82%,transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
  display:flex;gap:3px;padding:0 12px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{background:none;border:0;padding:12px 14px;color:var(--text-3);font-weight:600;
  font-size:14px;letter-spacing:-.01em;border-bottom:2px solid transparent;white-space:nowrap;transition:.15s color}
nav.tabs button:hover{color:var(--text-2)}
nav.tabs button[aria-selected="true"]{color:var(--text);border-bottom-color:var(--accent)}
main{max-width:1120px;margin:0 auto;padding:18px 16px 96px}
@media(min-width:820px){ main{padding:26px 24px 64px} }
@media(max-width:819px){
  nav.tabs{position:fixed;top:auto;bottom:0;left:0;right:0;border-top:1px solid var(--line);border-bottom:0;
    justify-content:space-between;padding:5px 3px calc(5px + env(safe-area-inset-bottom));overflow:visible;
    background:color-mix(in srgb,var(--surface) 92%,transparent);box-shadow:0 -4px 20px -6px rgba(0,0,0,.14)}
  nav.tabs button{flex:1;padding:6px 1px 7px;font-size:10px;font-weight:600;border-bottom:0;
    display:flex;flex-direction:column;align-items:center;gap:3px;border-radius:12px;letter-spacing:-.02em}
  nav.tabs button .ic{line-height:0}
  nav.tabs button .ic svg{width:21px;height:21px;display:block}
  nav.tabs button[aria-selected="true"]{color:var(--accent)}
}
@media(min-width:820px){ nav.tabs button .ic{display:none} }

/* ---------- piezas ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-1)}
.card.pad{padding:16px}
.sec{margin-bottom:22px}
.sec>h2,h2.lbl{font-size:11.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--text-3);
  margin:0 0 10px 3px;font-weight:700}
.empty{padding:30px 16px;text-align:center;color:var(--text-3);font-size:13.5px}
.hr{height:1px;background:var(--line);margin:16px 0}

.btn{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 15px;
  font-weight:600;font-size:14px;letter-spacing:-.01em;color:var(--text);
  transition:.15s border-color,.15s background,.15s transform;display:inline-flex;align-items:center;
  justify-content:center;gap:7px}
.btn:hover{border-color:var(--line-2);background:var(--surface-2)}
.btn:active{transform:scale(.985)}
.btn.primary{background:linear-gradient(160deg,var(--accent),color-mix(in srgb,var(--accent) 72%,var(--accent-2)));
  border-color:transparent;color:var(--on-accent);box-shadow:0 4px 14px -6px color-mix(in srgb,var(--accent) 80%,transparent)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 35%,var(--line))}
.btn.danger:hover{background:color-mix(in srgb,var(--bad) 8%,transparent)}
.btn.sm{padding:6px 11px;font-size:12.5px;border-radius:10px}
.btn.block{width:100%}
.btn.dash{border-style:dashed;color:var(--text-2);background:transparent}
.btn:disabled{opacity:.4;cursor:default}

input[type=text],input[type=number],input[type=date],select,textarea{
  width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);
  padding:10px 12px;font-size:16px;transition:.15s border-color,.15s background}
textarea{min-height:66px;resize:vertical;line-height:1.45}
input:hover,select:hover,textarea:hover{border-color:var(--line-2)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);background:var(--surface);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 16%,transparent)}
label.f{display:block;margin-bottom:12px}
label.f>span{display:block;font-size:11.5px;font-weight:600;color:var(--text-2);margin-bottom:5px;letter-spacing:-.005em}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 12px}
@media(max-width:520px){ .grid3{grid-template-columns:1fr 1fr} }

.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 10px;font-size:11px;
  font-weight:700;border:1px solid var(--line);background:var(--surface-2);color:var(--text-2);white-space:nowrap;
  letter-spacing:-.01em}
.pill.deload{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 35%,transparent);
  background:color-mix(in srgb,var(--warn) var(--soft),transparent)}
.pill.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 35%,transparent);
  background:color-mix(in srgb,var(--ok) var(--soft),transparent)}
.pill.acc{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 35%,transparent);
  background:color-mix(in srgb,var(--accent) var(--soft),transparent)}

.tag-swim{--c:var(--swim)} .tag-bike{--c:var(--bike)} .tag-run{--c:var(--run)}
.tag-gym{--c:var(--gym)} .tag-brick{--c:var(--brick)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;font-weight:700;color:var(--c);
  background:color-mix(in srgb,var(--c) var(--soft),transparent);border-radius:8px;padding:4px 9px;
  text-transform:uppercase;letter-spacing:.06em}

/* ---------- héroe de Hoy ---------- */
.hero{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:18px 20px;
  box-shadow:var(--sh-2);margin-bottom:16px;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;
  background:linear-gradient(90deg,var(--swim),var(--bike),var(--run),var(--gym),var(--brick))}
.hero .date{font-family:var(--font-display);font-size:26px;font-weight:700;letter-spacing:-.035em;line-height:1.1}
.hero .sub{font-size:12.5px;color:var(--text-3);margin-top:3px}
.ring{width:54px;height:54px;flex:none;border-radius:50%;display:grid;place-items:center;
  font-size:12px;font-weight:700;font-family:var(--font-display);font-variant-numeric:tabular-nums}
.ring span{background:var(--surface);width:42px;height:42px;border-radius:50%;display:grid;place-items:center}

/* ---------- tarjeta de sesión ---------- */
.ses{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--sh-1);overflow:hidden;margin-bottom:11px;transition:.18s box-shadow,.18s border-color}
.ses:hover{box-shadow:var(--sh-2);border-color:var(--line-2)}
.ses .bar{position:absolute;left:0;top:0;bottom:0;width:4px;
  background:linear-gradient(180deg,var(--c),color-mix(in srgb,var(--c) 55%,transparent))}
.ses .body{padding:14px 16px 14px 19px}
.ses h3{font-size:16px;font-weight:650;letter-spacing:-.02em}
.ses .meta{font-size:13px;color:var(--text-2);margin-top:4px;line-height:1.45}
.ses .rx{margin-top:8px;font-size:13px;line-height:1.45;color:var(--text);
  background:color-mix(in srgb,var(--c) var(--soft),transparent);
  border-radius:var(--r-sm);padding:8px 11px}
.ses .rx b{font-weight:700;color:var(--c)}
.ses .sum{margin-top:8px;font-size:13px;font-weight:600;color:var(--c);font-variant-numeric:tabular-nums}
.ses.is-done{border-color:color-mix(in srgb,var(--c) 32%,var(--line))}
.ses.is-skipped{opacity:.5}
.ses.is-skipped h3{text-decoration:line-through}
.ses .acts{display:flex;gap:7px;margin-top:12px;flex-wrap:wrap}
.st{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:6px 11px;
  font-size:12.5px;font-weight:600;color:var(--text-2);transition:.15s}
.st:hover{border-color:var(--line-2);color:var(--text)}
.st[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:#fff}
.st.skip[aria-pressed="true"]{background:var(--text-3);border-color:var(--text-3)}

/* ---------- semana ---------- */
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:9px}
@media(max-width:819px){ .wk{grid-template-columns:1fr;gap:8px} }
.day{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:11px;min-height:112px;
  transition:.15s border-color,.15s box-shadow;cursor:pointer}
.day:hover{border-color:var(--line-2);box-shadow:var(--sh-1)}
.day.today{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 14%,transparent)}
.day h4{margin:0 0 8px;font-size:10.5px;color:var(--text-3);text-transform:uppercase;letter-spacing:.07em;
  font-weight:700;display:flex;justify-content:space-between;align-items:baseline}
.day h4 b{color:var(--text);font-size:14px;font-family:var(--font-display);letter-spacing:-.02em}
.mini{border-left:3px solid var(--c);background:color-mix(in srgb,var(--c) var(--soft),transparent);
  border-radius:8px;padding:6px 8px;margin-bottom:6px;font-size:12px;line-height:1.3}
.mini .t{font-weight:600;letter-spacing:-.01em}
.mini.done .t::after{content:" ✓";color:var(--c);font-weight:800}
.mini.skipped{opacity:.45;border-left-style:dotted}
@media(max-width:819px){ .day{display:flex;gap:12px;min-height:0;align-items:flex-start}
  .day h4{flex-direction:column;width:52px;flex:none;margin:0;gap:1px}
  .day .mini-wrap{flex:1;min-width:0} }

.meter{height:7px;border-radius:999px;background:var(--surface-3);overflow:hidden;display:flex}
.meter i{display:block;height:100%;border-radius:999px}
.stack{display:flex;height:10px;border-radius:999px;overflow:hidden;background:var(--surface-3);gap:2px}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin:10px 0 2px;font-size:12.5px;color:var(--text-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;border-radius:3px;display:block}
.legend b{font-variant-numeric:tabular-nums}

/* ---------- tabla del plan ---------- */
.ptab{width:100%;border-collapse:separate;border-spacing:0}
.ptab th{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--text-3);text-align:left;
  padding:9px 10px;font-weight:700}
.ptab td{padding:9px 10px;border-top:1px solid var(--line);font-size:13.5px;vertical-align:middle}
.ptab tr.cur td{background:color-mix(in srgb,var(--accent) 8%,transparent)}
.ptab tbody tr:hover td{background:var(--surface-2);cursor:pointer}
.ptab td.wn{font-weight:700;width:40px;color:var(--text-3);font-family:var(--font-display)}

/* ---------- gráficos ---------- */
.chart-card{padding:18px 18px 12px;margin-bottom:16px}
.chart-card h3{font-size:15px;letter-spacing:-.02em}
.chart-card p.hint{margin:3px 0 12px;font-size:12.5px;color:var(--text-3);line-height:1.45}
.cwrap{position:relative;height:236px}
@media(min-width:820px){ .cwrap{height:280px} }
.charts-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:819px){ .charts-2{grid-template-columns:1fr;gap:0} }
.dtab{width:100%;border-collapse:collapse;font-size:12px;margin-top:10px}
.dtab th,.dtab td{border-bottom:1px solid var(--line);padding:5px 7px;text-align:right;
  font-variant-numeric:tabular-nums}
.dtab th{color:var(--text-3);font-weight:600}
.dtab th:first-child,.dtab td:first-child{text-align:left}

/* ---------- hitos ---------- */
.ms{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-top:1px solid var(--line)}
.ms:first-child{border-top:0}
.ms .box{width:23px;height:23px;flex:none;border-radius:8px;border:1.5px solid var(--line-2);
  background:var(--surface-2);display:grid;place-items:center;font-size:13px;margin-top:1px;transition:.15s}
.ms .box:hover{border-color:var(--ok)}
.ms.done .box{background:var(--ok);border-color:var(--ok);color:#fff}
.ms.done .txt{color:var(--text-2)}
.ms .txt{font-size:13.5px;line-height:1.4}
.ms .when{font-size:11.5px;color:var(--text-3);margin-top:2px}

/* ---------- métricas / perfil ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(138px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px 14px;
  border-left:3px solid var(--c,var(--accent))}
.kpi span{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--text-3);
  font-weight:700;margin-bottom:4px}
.kpi b{font-family:var(--font-display);font-size:21px;font-weight:700;letter-spacing:-.035em;
  font-variant-numeric:tabular-nums;display:block;line-height:1.15}
.kpi em{font-style:normal;font-size:11.5px;color:var(--text-3);display:block;margin-top:3px}

/* ---------- modal ---------- */
.ovl{position:fixed;inset:0;background:rgba(8,10,14,.5);backdrop-filter:blur(3px);z-index:100;
  display:flex;align-items:flex-end;justify-content:center;animation:fade .16s ease}
@media(min-width:820px){ .ovl{align-items:center;padding:24px} }
@keyframes fade{from{opacity:0}}
.modal{background:var(--surface);width:100%;max-width:640px;max-height:92vh;overflow-y:auto;
  border-radius:24px 24px 0 0;box-shadow:var(--sh-3);animation:rise .22s cubic-bezier(.2,.8,.3,1)}
@keyframes rise{from{transform:translateY(18px);opacity:.6}}
@media(min-width:820px){ .modal{border-radius:22px} }
.modal header{position:sticky;top:0;background:color-mix(in srgb,var(--surface) 92%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
  padding:15px 18px;display:flex;align-items:center;gap:10px;z-index:2}
.modal header h2{font-size:16.5px;flex:1;min-width:0;letter-spacing:-.02em}
.modal .content{padding:16px 18px}
.modal footer{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);
  padding:12px 18px calc(12px + env(safe-area-inset-bottom));display:flex;gap:10px}
.modal footer .btn{flex:1}
.calc{background:var(--surface-2);border-radius:var(--r-sm);padding:11px 13px;margin:2px 0 14px;
  display:flex;gap:20px;flex-wrap:wrap}
.calc b{display:block;font-family:var(--font-display);font-size:19px;font-variant-numeric:tabular-nums;
  font-weight:700;line-height:1.2;letter-spacing:-.03em}
.calc span{color:var(--text-3);font-size:10px;text-transform:uppercase;letter-spacing:.07em;font-weight:700}

/* ---------- gym ---------- */
.ex{border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:11px;background:var(--surface-2)}
.ex .exhead{display:flex;gap:8px;align-items:center;margin-bottom:9px}
.ex .exhead input{flex:1;background:var(--surface)}
.sets{display:grid;grid-template-columns:auto 1fr 1fr 1fr auto;gap:7px;align-items:center;font-size:12px}
.sets .h{font-size:10px;color:var(--text-3);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.sets input{padding:7px;text-align:center;background:var(--surface)}
.sets .n{color:var(--text-3);font-weight:700;text-align:center;width:18px;font-variant-numeric:tabular-nums}
.xbtn{background:none;border:0;color:var(--text-3);font-size:17px;line-height:1;padding:3px 6px;border-radius:7px}
.xbtn:hover{color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,transparent)}
.rpe{display:flex;gap:5px;flex-wrap:wrap}
.rpe button{flex:1;min-width:30px;border:1px solid var(--line);background:var(--surface-2);border-radius:9px;
  padding:8px 0;font-size:13px;font-weight:600;color:var(--text-2);font-variant-numeric:tabular-nums;transition:.12s}
.rpe button:hover{border-color:var(--line-2)}
.rpe button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom));
  background:var(--text);color:var(--bg);padding:11px 18px;border-radius:999px;font-size:13.5px;font-weight:600;
  z-index:200;box-shadow:var(--sh-3);animation:up .22s cubic-bezier(.2,.8,.3,1)}
@media(min-width:820px){ .toast{bottom:26px} }
@keyframes up{from{opacity:0;transform:translate(-50%,10px)}}

/* ---------- avisos del entrenador ---------- */
.coach{border:1px solid color-mix(in srgb,var(--accent) 30%,var(--line));border-radius:var(--r);
  background:color-mix(in srgb,var(--accent) 7%,var(--surface));padding:14px 16px;margin-bottom:16px}
.coach h3{font-size:13px;color:var(--accent);text-transform:uppercase;letter-spacing:.07em;margin-bottom:8px;
  display:flex;align-items:center;gap:7px}
.coach ul{margin:0;padding-left:17px;font-size:13.5px;line-height:1.55}
.coach li{margin-bottom:3px}
.coach li b{font-weight:650}

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script>
"use strict";
/* ===================================================================
   Volcano Tri — app de seguimiento de entrenamiento (triatlón + gym)
   Todo el estado vive en localStorage bajo STORE_KEY.
   =================================================================== */
const STORE_KEY = "volcano_tri_v1";
const DEFAULT_START = "2026-09-21";   // lunes
const DEFAULT_RACE  = "2027-04-18";   // domingo

const TYPES = {
  swim : {label:"Natación", css:"tag-swim",  icon:"🏊"},
  bike : {label:"Bici",     css:"tag-bike",  icon:"🚴"},
  run  : {label:"Carrera",  css:"tag-run",   icon:"🏃"},
  gym  : {label:"Gym",      css:"tag-gym",   icon:"🏋️"},
  brick: {label:"Brick",    css:"tag-brick", icon:"🔁"}
};
const TYPE_ORDER = ["swim","bike","run","gym","brick"];
const DOW = ["Lunes","Martes","Miércoles","Jueves","Viernes","Sábado","Domingo"];
const DOW_S = ["Lun","Mar","Mié","Jue","Vie","Sáb","Dom"];

const PHASES = [
  {n:1, name:"Base",         from:1,  to:8,  hours:6.75, desc:"Técnica de natación y Z2. Gym 3 días de hipertrofia (8–12 reps)."},
  {n:2, name:"Construcción", from:9,  to:18, hours:7.0,  desc:"Más series en natación, un día de intervalos en bici. Gym 3 días hipertrofia/fuerza."},
  {n:3, name:"Específica",   from:19, to:26, hours:7.75, desc:"Brick los sábados y ritmo de carrera. Gym 2 días de fuerza."},
  {n:4, name:"Taper",        from:27, to:30, hours:6.5,  desc:"Volumen decreciente, gym 1–2 días de mantenimiento, aguas abiertas con neopreno."}
];
const TAPER_FACTOR = [1, .85, .7, .45];   // por semana dentro de la fase 4

const GYM_SUBTYPES = ["Torso A","Torso B","Pierna","Fuerza A","Fuerza B","Mantenimiento"];
const GYM_SEED = {
  "Torso A"      : ["Press banca","Remo con barra","Press militar","Jalón al pecho","Face pull"],
  "Torso B"      : ["Press inclinado mancuerna","Dominadas","Fondos","Curl bíceps","Extensión tríceps"],
  "Pierna"       : ["Sentadilla","Peso muerto rumano","Prensa","Zancadas","Gemelo de pie","Plancha"],
  "Fuerza A"     : ["Sentadilla","Press banca","Remo con barra","Plancha"],
  "Fuerza B"     : ["Peso muerto","Press militar","Dominadas","Zancadas"],
  "Mantenimiento": ["Sentadilla goblet","Press mancuernas","Remo con mancuerna","Plancha"]
};
const BIG_LIFTS = ["Sentadilla","Press banca","Peso muerto","Peso muerto rumano","Press militar","Remo con barra"];

/* plantillas por fase — dow 1=lunes … 7=domingo */
function defaultTemplates(){
  return {
    1:[
      {dow:1,type:"gym", subtype:"Torso A", title:"Gym Torso A", min:55},
      {dow:1,type:"swim",focus:"tecnica",title:"Natación técnica", min:30, note:"Drills + 8×25 respiración"},
      {dow:2,type:"run", focus:"calidad", title:"Carrera de calidad", min:45, note:"5×3' a ritmo 10K, rec 2'"},
      {dow:3,type:"swim",focus:"series",title:"Natación", min:40, note:"Técnica + series cortas"},
      {dow:4,type:"gym", subtype:"Pierna", title:"Gym Pierna", min:50},
      {dow:5,type:"gym", subtype:"Torso B", title:"Gym Torso B + brazos", min:55, opt:true},
      {dow:6,type:"bike",focus:"z2",title:"Bici Z2", min:75, note:"Progresar hasta 2 h a lo largo de la fase"},
      {dow:7,type:"run", focus:"z2", title:"Carrera Z2", min:60},
      {dow:7,type:"swim",focus:"suave",title:"Natación suave", min:25, opt:true}
    ],
    2:[
      {dow:1,type:"gym", subtype:"Torso A", title:"Gym Torso A", min:55},
      {dow:1,type:"swim",focus:"series",title:"Natación series", min:35, note:"10×50 / 6×100"},
      {dow:2,type:"run", focus:"calidad", title:"Carrera de calidad", min:50, note:"6×3' o 4×5' a ritmo 10K"},
      {dow:3,type:"swim",focus:"umbral",title:"Natación", min:45, note:"Técnica + umbral 4×200"},
      {dow:4,type:"gym", subtype:"Pierna", title:"Gym Pierna", min:50},
      {dow:5,type:"gym", subtype:"Torso B", title:"Gym Torso B + brazos", min:50, opt:true},
      {dow:6,type:"bike",focus:"intervalos",title:"Bici intervalos", min:90, note:"4×6' Z4, rec 4'"},
      {dow:7,type:"run", focus:"z2", title:"Carrera Z2 larga", min:75}
    ],
    3:[
      {dow:1,type:"gym", subtype:"Fuerza A", title:"Gym Fuerza A", min:50, note:"3–6 reps, RIR 2"},
      {dow:1,type:"swim",focus:"series",title:"Natación series", min:35, note:"Ritmo objetivo 100/200"},
      {dow:2,type:"run", focus:"ritmo", title:"Carrera a ritmo objetivo", min:50, note:"3×10' a ritmo de 10K del tri"},
      {dow:3,type:"swim",focus:"continuo",title:"Natación continua", min:50, note:"800–1.500 m seguidos"},
      {dow:4,type:"gym", subtype:"Fuerza B", title:"Gym Fuerza B", min:50, note:"3–6 reps, RIR 2"},
      {dow:5,type:"swim",focus:"suave",title:"Natación suave / técnica", min:30, opt:true},
      {dow:6,type:"brick",focus:"brick",title:"Brick bici + carrera", min:110, note:"90' bici Z2-Z3 + 20' corriendo a ritmo"},
      {dow:7,type:"run", focus:"z2", title:"Carrera Z2 larga", min:80}
    ],
    4:[
      {dow:1,type:"gym", subtype:"Mantenimiento", title:"Gym mantenimiento", min:35, note:"Cargas medias, sin fallo"},
      {dow:1,type:"swim",focus:"suave",title:"Natación suave", min:30},
      {dow:2,type:"run", focus:"ritmo", title:"Carrera con activaciones", min:35, note:"4×1' a ritmo de carrera"},
      {dow:3,type:"swim",focus:"abiertas",title:"Aguas abiertas (neopreno)", min:40, note:"Salidas, orientación, nado en grupo"},
      {dow:4,type:"gym", subtype:"Mantenimiento", title:"Gym suave", min:30, opt:true},
      {dow:5,type:"bike",focus:"z2",title:"Bici suave", min:45, note:"3×1' a ritmo de carrera"},
      {dow:6,type:"brick",focus:"brick",title:"Brick corto", min:50, note:"40' bici + 10' carrera"},
      {dow:7,type:"run", focus:"z2", title:"Carrera Z2", min:45}
    ]
  };
}

function defaultMilestones(){
  return [
    {id:"m1", cat:"swim", text:"Natación: 10×50 m con buena respiración", target:"2026-10-31", done:false, doneDate:null},
    {id:"m2", cat:"swim", text:"Natación: 400 m seguidos", target:"2026-11-15", done:false, doneDate:null},
    {id:"m3", cat:"test", text:"Test: 5K corriendo", target:"2026-11-15", done:false, doneDate:null},
    {id:"m4", cat:"test", text:"Test: 400 m y 200 m en piscina", target:"2026-11-15", done:false, doneDate:null},
    {id:"m5", cat:"test", text:"Test: 20' en bici (potencia/velocidad)", target:"2026-11-15", done:false, doneDate:null},
    {id:"m6", cat:"swim", text:"Natación: 1.000 m seguidos", target:"2027-01-31", done:false, doneDate:null},
    {id:"m7", cat:"race", text:"Ensayo: media maratón o duatlón/sprint", target:"2027-03-07", done:false, doneDate:null},
    {id:"m8", cat:"swim", text:"Natación: 1.500 m seguidos", target:"2027-03-21", done:false, doneDate:null},
    {id:"m9", cat:"swim", text:"2 sesiones en aguas abiertas con neopreno", target:"2027-04-11", done:false, doneDate:null}
  ];
}

function defaultMarks(){
  return [{ id:"seedhm", date:"2026-04-19", cat:"run", kind:"race", distM:21097, timeSec:6900,
            watts:null, note:"Media maratón de referencia" }];
}
function defaultDB(){
  return {
    version:1,
    settings:{ raceDate:DEFAULT_RACE, planStart:DEFAULT_START, theme:"auto", deloadPct:0.35,
               raceName:"Triatlón olímpico" },
    templates: defaultTemplates(),
    planned:{},          // "YYYY-MM-DD" -> [sesión planificada]
    sessions:[],         // registros realizados
    diary:{},            // "YYYY-MM-DD" -> {weightKg, sleepH, feel, notes}
    milestones: defaultMilestones(),
    marks: defaultMarks(),   // carreras y tests: alimentan los ritmos de todo el plan
    weekMeta:{},             // factor con el que se generó cada semana
    exerciseMemory:{}    // subtipo -> [{name, sets:[{reps,kg,rir}]}]
  };
}

/* =================== estado + persistencia =================== */
let DB = loadDB();
const state = { view:"hoy", day:todayISO(), week:null, chartRefs:{}, showTable:false };

function loadDB(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(!raw) return defaultDB();
    return normalize(JSON.parse(raw));
  }catch(e){ console.warn("No se pudo leer localStorage:", e); return defaultDB(); }
}
function normalize(o){
  const d = defaultDB();
  if(!o || typeof o !== "object") return d;
  const db = Object.assign(d, o);
  db.settings = Object.assign(defaultDB().settings, o.settings || {});
  db.templates = Object.assign(defaultTemplates(), o.templates || {});
  db.planned  = o.planned  && typeof o.planned==="object" ? o.planned : {};
  db.sessions = Array.isArray(o.sessions) ? o.sessions : [];
  db.diary    = o.diary && typeof o.diary==="object" ? o.diary : {};
  db.milestones = Array.isArray(o.milestones) && o.milestones.length ? o.milestones : defaultMilestones();
  db.exerciseMemory = o.exerciseMemory && typeof o.exerciseMemory==="object" ? o.exerciseMemory : {};
  db.marks = Array.isArray(o.marks) ? o.marks : defaultMarks();
  db.weekMeta = o.weekMeta && typeof o.weekMeta==="object" ? o.weekMeta : {};
  db.version = 1;
  return db;
}
let saveTimer = null;
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{
    try{ localStorage.setItem(STORE_KEY, JSON.stringify(DB)); }
    catch(e){ toast("⚠️ No se pudo guardar (¿almacenamiento lleno?)"); console.error(e); }
  }, 60);
}

/* =================== utilidades =================== */
function pad(n){ return String(n).padStart(2,"0"); }
function iso(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function parseISO(s){ const p=String(s).split("-").map(Number); return new Date(p[0], (p[1]||1)-1, p[2]||1); }
function todayISO(){ return iso(new Date()); }
function addDays(d,n){ const x=new Date(d.getFullYear(),d.getMonth(),d.getDate()); x.setDate(x.getDate()+n); return x; }
function ddmm(d){ d = typeof d==="string"?parseISO(d):d; return pad(d.getDate())+"/"+pad(d.getMonth()+1); }
function ddmmyy(d){ d = typeof d==="string"?parseISO(d):d; return ddmm(d)+"/"+d.getFullYear(); }
function mondayOf(d){ d = typeof d==="string"?parseISO(d):d; const wd=(d.getDay()+6)%7; return addDays(d,-wd); }
function daysBetween(a,b){ return Math.round((parseISO(iso(b)) - parseISO(iso(a)))/86400000); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function num(v){ const n=parseFloat(String(v==null?"":v).replace(",",".")); return isFinite(n)?n:null; }
function round5(x){ return Math.max(5, Math.round(x/5)*5); }

/* tiempos: "45" = 45 min · "32:10" = mm:ss · "1:12:30" = h:mm:ss */
function parseTime(str){
  if(str==null) return 0;
  const s = String(str).trim().replace(",",".");
  if(!s) return 0;
  const p = s.split(":").map(x => parseFloat(x)||0);
  if(p.length===1) return Math.round(p[0]*60);
  if(p.length===2) return Math.round(p[0]*60 + p[1]);
  return Math.round(p[0]*3600 + p[1]*60 + p[2]);
}
function fmtSec(sec, mode){
  sec = Math.max(0, Math.round(sec||0));
  const h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60), s = sec%60;
  if(mode==="hm" || (mode!=="ms" && h>0)) return h+":"+pad(m)+":"+pad(s);
  return m+":"+pad(s);
}
function fmtHours(min){
  min = Math.round(min||0);
  const h = Math.floor(min/60), m = min%60;
  return h ? (h+" h "+(m?pad(m)+"′":"")).trim() : m+"′";
}
function hoursNum(min){ return Math.round((min/60)*100)/100; }
function esNum(x, dec){ return Number(x).toFixed(dec==null?1:dec).replace(".", ","); }

/* =================== modelo del plan =================== */
function planStartD(){ return mondayOf(DB.settings.planStart || DEFAULT_START); }
function raceD(){ return parseISO(DB.settings.raceDate || DEFAULT_RACE); }
function totalWeeks(){
  const w = Math.floor(daysBetween(planStartD(), mondayOf(raceD()))/7) + 1;
  return Math.min(80, Math.max(4, w));
}
function weekStart(w){ return addDays(planStartD(), (w-1)*7); }
function weekEnd(w){ return addDays(weekStart(w), 6); }
function weekIndexOf(date){ return Math.floor(daysBetween(planStartD(), mondayOf(date))/7) + 1; }
function phaseRanges(){
  const T = totalWeeks();
  return PHASES.map(p => ({...p, to: (p.n===4 ? T : Math.min(p.to, T))}))
               .filter(p => p.from <= T && p.from <= p.to);
}
function phaseOfWeek(w){
  const rs = phaseRanges();
  for(const p of rs){ if(w>=p.from && w<=p.to) return p; }
  return w < 1 ? rs[0] : rs[rs.length-1];
}
function xmasWeek(){
  const ps = planStartD(), rd = raceD();
  for(const y of [ps.getFullYear(), ps.getFullYear()+1]){
    const d = new Date(y, 11, 21);
    if(d >= ps && d <= rd) return weekIndexOf(d);
  }
  return -1;
}
function isDeload(w){
  const p = phaseOfWeek(w);
  if(!p || p.n === 4) return false;         // el taper ya es descendente
  if(w % 4 === 0) return true;
  return w === xmasWeek();
}
function baseFactor(w){
  const p = phaseOfWeek(w);
  let f = isDeload(w) ? (1 - (DB.settings.deloadPct ?? .35)) : 1;
  if(p && p.n === 4) f *= TAPER_FACTOR[Math.min(w - p.from, TAPER_FACTOR.length-1)];
  return f;
}
function weekFactor(w){ return Math.round(baseFactor(w) * coachFactor(w).f * 100) / 100; }
function weekTargetMin(w){
  const p = phaseOfWeek(w);
  if(!p) return 0;
  const meta = DB.weekMeta[w];
  const f = meta && isFinite(Number(meta.k)) ? Number(meta.k) : weekFactor(w);
  return Math.round(p.hours * 60 * f);
}

/* ---- sesiones planificadas: se materializan la 1ª vez que se ven ---- */
function genDay(dateISO){
  const d = parseISO(dateISO), w = weekIndexOf(d), T = totalWeeks();
  if(w < 1 || w > T) return [];
  if(dateISO === DB.settings.raceDate){
    return [{id:uid(), type:"brick", title:"🏁 "+(DB.settings.raceName||"Carrera"), min:180,
             note:"1,5 km natación · 40 km bici · 10 km carrera", phase:phaseOfWeek(w).n, week:w, race:true}];
  }
  const p = phaseOfWeek(w);
  const dow = (d.getDay()+6)%7 + 1;
  const f = weekFactor(w);
  return (DB.templates[p.n]||[]).filter(t => t.dow === dow).map(t => ({
    id:uid(), type:t.type, subtype:t.subtype||null, title:t.title, focus:t.focus||inferFocus(t),
    min:round5((t.min||30)*f), note:t.note||"", opt:!!t.opt, phase:p.n, week:w
  }));
}
function ensureWeek(w){
  let changed = false;
  const key = weekFactor(w).toFixed(2);
  const meta = DB.weekMeta[w];
  /* si el ajuste ha cambiado y la semana todavía no ha empezado, se vuelve a generar */
  if(meta && meta.k !== key && iso(weekStart(w)) > todayISO()){
    for(let i=0;i<7;i++) delete DB.planned[iso(addDays(weekStart(w), i))];
    DB.weekMeta[w] = {k:key}; changed = true;
  }
  for(let i=0;i<7;i++){
    const k = iso(addDays(weekStart(w), i));
    if(!(k in DB.planned)){ DB.planned[k] = genDay(k); changed = true; }
  }
  if(!DB.weekMeta[w]){ DB.weekMeta[w] = {k:key}; changed = true; }
  if(changed) save();
}
function ensureDay(dateISO){ ensureWeek(weekIndexOf(parseISO(dateISO))); }
function regenWeek(w){
  for(let i=0;i<7;i++){ delete DB.planned[iso(addDays(weekStart(w), i))]; }
  delete DB.weekMeta[w];
  ensureWeek(w); save();
}
function plannedOn(dateISO){ ensureDay(dateISO); return DB.planned[dateISO] || []; }

/* ---- sesiones realizadas ---- */
function sessionsOn(dateISO){ return DB.sessions.filter(s => s.date === dateISO); }
function sessionByPlanned(pid){ return DB.sessions.find(s => s.plannedId === pid) || null; }
function sessionById(id){ return DB.sessions.find(s => s.id === id) || null; }
function sessionsInWeek(w){
  const a = iso(weekStart(w)), b = iso(weekEnd(w));
  return DB.sessions.filter(s => s.date >= a && s.date <= b);
}
function doneMin(list){ return list.reduce((t,s)=> t + (s.status==="skipped"?0:(s.durationMin||0)), 0); }
function minutesByType(list){
  const o = {}; TYPE_ORDER.forEach(t => o[t]=0);
  list.forEach(s => { if(s.status!=="skipped" && o[s.type]!=null) o[s.type] += (s.durationMin||0); });
  return o;
}
function plannedMinWeek(w){
  ensureWeek(w); let t = 0;
  for(let i=0;i<7;i++) (DB.planned[iso(addDays(weekStart(w),i))]||[]).forEach(p => { t += p.min; });
  return t;
}
function compliance(w){
  const pm = plannedMinWeek(w); if(!pm) return null;
  return Math.round(doneMin(sessionsInWeek(w)) / pm * 100);
}

/* ---- cálculos de métricas ---- */
function swimPace100(s){   // seg / 100 m
  const d = s.swim && s.swim.distM, t = s.swim && s.swim.timeSec;
  return (d>0 && t>0) ? t / (d/100) : null;
}
function bikeSpeed(b){ return (b && b.distKm>0 && b.timeSec>0) ? b.distKm/(b.timeSec/3600) : null; }
function runPace(r){ return (r && r.distKm>0 && r.timeSec>0) ? r.timeSec/r.distKm : null; }
function gymVolume(g){
  if(!g || !g.exercises) return 0;
  return g.exercises.reduce((t,e)=> t + (e.sets||[]).reduce((u,st)=> u + (num(st.reps)||0)*(num(st.kg)||0), 0), 0);
}
function epley(kg, reps){ return (kg>0 && reps>0) ? kg*(1 + reps/30) : null; }
function bestEpley(ex){
  let best = null;
  (ex.sets||[]).forEach(st => { const e = epley(num(st.kg), num(st.reps)); if(e && (!best || e>best)) best = e; });
  return best;
}

/* ===================================================================
   MOTOR ADAPTATIVO
   Tus marcas y tus entrenos mandan: de ahí salen los ritmos de cada
   sesión, los metros de natación continua y el volumen de la semana.
   =================================================================== */
function inferFocus(t){
  const s = ((t.title||"")+" "+(t.note||"")).toLowerCase();
  if(t.type === "swim"){
    if(/abiert|neopren/.test(s)) return "abiertas";
    if(/continu|larga|seguid/.test(s)) return "continuo";
    if(/umbral/.test(s)) return "umbral";
    if(/serie|interval/.test(s)) return "series";
    if(/suave|recuper/.test(s)) return "suave";
    return "tecnica";
  }
  if(t.type === "run"){
    if(/calidad|interval|series/.test(s)) return "calidad";
    if(/ritmo|objetivo|competi|activa/.test(s)) return "ritmo";
    return "z2";
  }
  if(t.type === "bike") return /interval|series|z4|umbral/.test(s) ? "intervalos" : "z2";
  if(t.type === "brick") return "brick";
  return null;
}

const MARK_WINDOW_DAYS = 180;   // más allá de esto, una marca ya no representa tu forma
/* --- fórmula de Riegel: predice un tiempo a otra distancia --- */
function riegel(distM, timeSec, targetM){ return timeSec * Math.pow(targetM/distM, 1.06); }

function marksOf(cat){ return DB.marks.filter(m => m.cat === cat).sort((a,b) => a.date < b.date ? 1 : -1); }
function markPace10k(m){ return riegel(m.distM, m.timeSec, 10000) / 10; }   // s/km

/* --- perfil actual del atleta --- */
function computeProfile(){
  const prof = { run:null, swim:null, bike:null };

  /* CARRERA — de la marca más reciente, o de tus rodajes suaves */
  const runAll = marksOf("run").filter(m => m.distM >= 1500 && m.timeSec > 0);
  /* vale la mejor marca de los últimos meses: una marca vieja deja de mandar sobre el plan */
  const fresh = runAll.filter(m => daysBetween(parseISO(m.date), new Date()) <= MARK_WINDOW_DAYS);
  const runMarks = fresh.length ? fresh : runAll.slice(0,1);
  if(runMarks.length){
    const best = runMarks.sort((a,b) => markPace10k(a) - markPace10k(b))[0];
    const p10k = markPace10k(best);
    prof.run = { p10k, p5k:p10k*0.965, threshold:p10k*1.035, easy:p10k*1.29, tri:p10k*1.07,
                 src:"tu "+markLabel(best)+" del "+ddmm(best.date), fromMark:true };
  } else {
    const easy = DB.sessions.filter(s => s.type==="run" && s.run && runPace(s.run) && (!s.rpe || s.rpe<=5))
                            .slice(-6).map(s => runPace(s.run)).sort((a,b)=>a-b);
    if(easy.length >= 2){
      const med = easy[Math.floor(easy.length/2)];
      const p10k = med/1.29;
      prof.run = { p10k, p5k:p10k*0.965, threshold:p10k*1.035, easy:med, tri:p10k*1.07,
                   src:"la media de tus rodajes suaves", fromMark:false };
    }
  }

  /* NATACIÓN — CSS (velocidad crítica) con los tests de 400 y 200 */
  const sw = marksOf("swim").filter(m => m.timeSec > 0);
  const m400 = sw.find(m => m.distM === 400), m200 = sw.find(m => m.distM === 200);
  let css = null, src = "";
  if(m400 && m200 && m400.timeSec > m200.timeSec){
    css = (m400.timeSec - m200.timeSec) / 2;
    src = "tus tests de 400 y 200 m";
  } else if(m400){ css = (m400.timeSec/4)*1.03; src = "tu test de 400 m del "+ddmm(m400.date); }
  else if(m200){ css = (m200.timeSec/2)*1.08; src = "tu test de 200 m del "+ddmm(m200.date); }
  else {
    const paces = DB.sessions.filter(s => s.type==="swim" && swimPace100(s)).slice(-6)
                             .map(s => swimPace100(s)).sort((a,b)=>a-b);
    if(paces.length){ css = paces[0]*1.02; src = "tu mejor ritmo en los entrenos"; }
  }
  if(css) prof.swim = { css, easy:css+9, p100:css-2, p50:css-5, src };

  /* BICI — FTP desde el test de 20′ */
  const bk = marksOf("bike").filter(m => m.watts > 0 || m.distM > 0);
  const bw = bk.find(m => m.watts > 0);
  if(bw) prof.bike = { ftp:Math.round(bw.watts*0.95), src:"tu test de 20′ del "+ddmm(bw.date) };
  else {
    const spd = bk.find(m => m.distM > 0 && m.timeSec > 0);
    if(spd) prof.bike = { ftp:null, speed:spd.distM/1000/(spd.timeSec/3600), src:"tu test de 20′ del "+ddmm(spd.date) };
  }
  return prof;
}
function markLabel(m){
  if(m.cat === "swim") return m.distM + " m";
  if(m.cat === "bike") return "test de 20′";
  const km = m.distM/1000;
  if(Math.abs(km-21.097) < .3) return "media maratón";
  if(Math.abs(km-42.195) < .5) return "maratón";
  return (Number.isInteger(km) ? km : esNum(km)) + " K";
}
const pk  = p => fmtSec(p, "ms") + "/km";
const p100 = p => fmtSec(p, "ms") + "/100";
function pkRange(p, lo, hi){ return fmtSec(p*lo,"ms")+"–"+fmtSec(p*hi,"ms")+"/km"; }

/* --- metros seguidos que toca intentar hoy en el agua --- */
function swimContTarget(dateISO){
  const prev = DB.sessions.filter(s => s.type==="swim" && s.swim && s.swim.contMaxM > 0 && s.date <= dateISO);
  const best = prev.length ? Math.max(...prev.map(s => s.swim.contMaxM)) : 0;
  const w = weekIndexOf(parseISO(dateISO));
  const ceiling = w <= 8 ? 600 : w <= 18 ? 1200 : 1800;
  if(!best) return 200;
  return Math.max(200, Math.min(ceiling, Math.round(best*1.15/50)*50));
}

/* --- la prescripción de cada sesión, con tus números --- */
function prescribe(pl, dateISO){
  const P = computeProfile();
  const f = pl.focus || inferFocus(pl);
  if(pl.type === "run"){
    if(!P.run) return null;
    if(f === "calidad") return "Series a <b>"+pk(P.run.p10k)+"</b> (ritmo 10K) · resto suave a "+pk(P.run.easy);
    if(f === "ritmo")   return "A ritmo de carrera: <b>"+pk(P.run.tri)+"</b> · calienta a "+pk(P.run.easy);
    return "Z2 fácil: <b>"+pkRange(P.run.easy, 1, 1.06)+"</b> · si no puedes hablar, vas rápido";
  }
  if(pl.type === "swim"){
    if(f === "continuo"){
      const t = swimContTarget(dateISO);
      return "Objetivo de hoy: <b>"+t+" m seguidos</b>"+(P.swim ? " a "+p100(P.swim.easy) : "");
    }
    if(!P.swim) return null;
    if(f === "series") return "50 a <b>"+p100(P.swim.p50)+"</b> · 100 a <b>"+p100(P.swim.p100)+"</b> · rec 15–20″";
    if(f === "umbral") return "Umbral (CSS): <b>"+p100(P.swim.css)+"</b> · 4×200 con 20″";
    if(f === "abiertas") return "Neopreno · bloques continuos, orientación cada 6 brazadas";
    return "Suave y largo: <b>"+p100(P.swim.easy)+"</b> · técnica y respiración";
  }
  if(pl.type === "bike"){
    if(!P.bike) return null;
    if(P.bike.ftp){
      return f === "intervalos"
        ? "Series a <b>"+Math.round(P.bike.ftp*.95)+"–"+Math.round(P.bike.ftp*1.05)+" W</b> (Z4) · FTP "+P.bike.ftp+" W"
        : "Z2: <b>"+Math.round(P.bike.ftp*.60)+"–"+Math.round(P.bike.ftp*.75)+" W</b> · FTP "+P.bike.ftp+" W";
    }
    return f === "intervalos"
      ? "Series fuertes, a tope sostenible 6′ (ref. "+esNum(P.bike.speed)+" km/h en llano)"
      : "Z2: cómodo, en torno a <b>"+esNum(P.bike.speed*0.82)+" km/h</b> en llano";
  }
  if(pl.type === "brick"){
    const a = P.bike && P.bike.ftp ? "Bici a <b>"+Math.round(P.bike.ftp*.70)+"–"+Math.round(P.bike.ftp*.85)+" W</b>" : "Bici a Z2–Z3";
    const b = P.run ? " · carrera a <b>"+pk(P.run.tri)+"</b> (ritmo del tri)" : "";
    return a + b;
  }
  if(pl.type === "gym"){
    const p = phaseOfWeek(weekIndexOf(parseISO(dateISO)));
    if(!p) return null;
    return p.n <= 2 ? "Hipertrofia: <b>8–12 reps</b>, RIR 2 · sube el peso cuando te sobren 2 reps"
         : p.n === 3 ? "Fuerza: <b>3–6 reps</b>, RIR 2 · sin llegar al fallo"
         : "Mantenimiento: <b>2×6</b> cómodas, nada de fallo";
  }
  return null;
}

/* --- ajuste del volumen según cómo vayas cumpliendo y cómo te sientas --- */
function adherence(w){
  const p = phaseOfWeek(w); if(!p) return null;
  const target = p.hours * 60 * baseFactor(w);
  if(!target) return null;
  return doneMin(sessionsInWeek(w)) / target;
}
function mean(a){ return a.length ? a.reduce((x,y)=>x+y,0)/a.length : null; }
function last7(){
  const from = iso(addDays(new Date(), -7));
  return { ses:DB.sessions.filter(s => s.date >= from && s.status !== "skipped"),
           dia:Object.keys(DB.diary).filter(d => d >= from).map(d => DB.diary[d]) };
}
function coachFactor(w){
  let f = 1; const why = [];
  const today = todayISO();
  const prev = [w-1, w-2].filter(x => x >= 1 && iso(weekEnd(x)) < today);
  const adh = prev.map(adherence).filter(x => x != null);
  if(adh.length){
    const a = mean(adh);
    if(a < 0.70){ f *= 0.90; why.push({k:"bad", t:"En las últimas semanas te has quedado en el <b>"+Math.round(a*100)+"%</b> del volumen previsto: bajo un 10% la semana que viene para que puedas engancharte."}); }
    else if(a >= 0.95){
      const rpe = mean(prev.flatMap(x => sessionsInWeek(x).map(s => s.rpe).filter(Boolean)));
      if(rpe && rpe <= 6.2){ f *= 1.06; why.push({k:"good", t:"Estás cumpliendo el <b>"+Math.round(a*100)+"%</b> con un RPE medio de solo "+esNum(rpe)+": subo el volumen un 6%."}); }
    }
  }
  const L = last7();
  const rpe7 = mean(L.ses.map(s => s.rpe).filter(Boolean));
  const feel7 = mean(L.dia.map(d => d.feel).filter(Boolean));
  const sleep7 = mean(L.dia.map(d => d.sleepH).filter(Boolean));
  if(rpe7 >= 7.5 || (feel7 != null && feel7 <= 2.3) || (sleep7 != null && sleep7 < 6)){
    f *= 0.90;
    const causa = rpe7 >= 7.5 ? "el RPE medio de la semana va por "+esNum(rpe7)
                : (feel7 != null && feel7 <= 2.3) ? "tus sensaciones están por los suelos"
                : "duermes menos de 6 h de media";
    why.push({k:"warn", t:"Bajo el volumen un 10% porque "+causa+"."});
  }
  f = Math.min(1.1, Math.max(0.8, f));
  return { f, why };
}

/* --- avisos del entrenador para la vista Hoy --- */
function coachAdvice(){
  const out = [];
  const P = computeProfile();
  const T = totalWeeks(), w = Math.min(T, Math.max(1, weekIndexOf(new Date())));
  if(!DB.marks.length || !P.run){
    out.push({k:"warn", t:"Todavía no tengo marcas tuyas: mete una carrera o un test en <b>Marcas</b> y el plan calculará tus ritmos."});
  }
  if(!P.swim){
    out.push({k:"warn", t:"Sin test de natación no puedo darte ritmos en el agua. Nada un <b>400 m</b> y un <b>200 m</b> a tope y apúntalos en <b>Marcas</b>."});
  }
  if(!P.bike){
    out.push({k:"warn", t:"Añade un <b>test de 20′ en bici</b> en Marcas y te pongo los vatios de cada sesión."});
  }
  const next = coachFactor(w + 1);
  next.why.forEach(x => out.push(x));
  const best = DB.sessions.filter(s => s.type==="swim" && s.swim && s.swim.contMaxM > 0);
  if(best.length){
    const b = Math.max(...best.map(s => s.swim.contMaxM));
    const t = swimContTarget(todayISO());
    if(t > b) out.push({k:"good", t:"Tu récord nadando seguido está en <b>"+b+" m</b>. El próximo día toca intentar <b>"+t+" m</b>."});
  }
  return out;
}

/* --- los hitos se marcan solos en cuanto los datos los cumplen --- */
function autoCheckMilestones(){
  let changed = false;
  const hit = (id, date) => {
    const m = DB.milestones.find(x => x.id === id);
    if(m && !m.done && date){ m.done = true; m.doneDate = date; m.auto = true; changed = true; }
  };
  const contAt = d => {
    const s = DB.sessions.filter(x => x.type==="swim" && x.swim && x.swim.contMaxM >= d)
                         .sort((a,b) => a.date < b.date ? -1 : 1)[0];
    return s ? s.date : null;
  };
  const firstMark = f => {
    const m = DB.marks.filter(f).sort((a,b) => a.date < b.date ? -1 : 1)[0];
    return m ? m.date : null;
  };
  hit("m2", contAt(400)); hit("m6", contAt(1000)); hit("m8", contAt(1500));
  hit("m3", firstMark(m => m.cat==="run" && m.distM===5000));
  const s4 = firstMark(m => m.cat==="swim" && m.distM===400), s2 = firstMark(m => m.cat==="swim" && m.distM===200);
  if(s4 && s2) hit("m4", s4 > s2 ? s4 : s2);
  hit("m5", firstMark(m => m.cat==="bike"));
  hit("m7", firstMark(m => m.cat==="run" && m.kind==="race" && m.date >= iso(weekStart(19))));
  const oa = DB.sessions.filter(x => x.type==="swim" && /abiert|neopren/i.test((x.title||"")+" "+(x.notes||"")))
                        .sort((a,b) => a.date < b.date ? -1 : 1);
  if(oa.length >= 2) hit("m9", oa[1].date);
  if(changed) save();
}

/* --- gimnasio: sube el peso cuando la última sesión te sobró --- */
function gymProgress(ex){
  const sets = (ex.sets||[]).filter(st => num(st.kg) > 0);
  if(sets.length < 2) return {up:false, inc:0};
  const rirs = sets.map(st => num(st.rir)).filter(x => x != null);
  if(rirs.length < sets.length || !rirs.every(r => r >= 2)) return {up:false, inc:0};
  const inc = /sentadilla|peso muerto|prensa|zancad|hip *thrust|gemelo/i.test(ex.name||"") ? 5 : 2.5;
  return {up:true, inc};
}

/* =================== vista HOY =================== */
function sesSummary(s){
  if(!s) return "";
  const bits = [];
  if(s.status === "skipped") return "Saltada";
  if(s.durationMin) bits.push(fmtHours(s.durationMin));
  if(s.type === "swim" && s.swim){
    if(s.swim.distM) bits.push(s.swim.distM+" m");
    const p = swimPace100(s); if(p) bits.push(fmtSec(p,"ms")+"/100 m");
  }
  if(s.type === "bike" && s.bike){
    if(s.bike.distKm) bits.push(s.bike.distKm+" km");
    const v = bikeSpeed(s.bike); if(v) bits.push(esNum(v)+" km/h");
    if(s.bike.hrAvg) bits.push(s.bike.hrAvg+" ppm");
  }
  if(s.type === "run" && s.run){
    if(s.run.distKm) bits.push(s.run.distKm+" km");
    const p = runPace(s.run); if(p) bits.push(fmtSec(p,"ms")+"/km");
    if(s.run.hrAvg) bits.push(s.run.hrAvg+" ppm");
  }
  if(s.type === "brick" && s.brick){
    const b = s.brick.bike||{}, r = s.brick.run||{};
    if(b.distKm) bits.push("🚴 "+b.distKm+" km");
    if(r.distKm){ const p = runPace(r); bits.push("🏃 "+r.distKm+" km"+(p? " a "+fmtSec(p,"ms")+"/km":"")); }
  }
  if(s.type === "gym" && s.gym){
    const vol = gymVolume(s.gym);
    if(vol) bits.push(Math.round(vol).toLocaleString("es-ES")+" kg de volumen");
    const n = (s.gym.exercises||[]).length; if(n) bits.push(n+" ejercicios");
  }
  if(s.rpe) bits.push("RPE "+s.rpe);
  return bits.join(" · ");
}

  const st = s ? s.status : null;
  const cls = st === "done" || st === "partial" ? "is-done" : st === "skipped" ? "is-skipped" : "";

    '<div class="bar"></div><div class="body">'+

function viewHoy(){
  const d = state.day, dd = parseISO(d);
  const w = weekIndexOf(dd), T = totalWeeks(), inPlan = w>=1 && w<=T;
  const ph = inPlan ? phaseOfWeek(w) : null;
  const plan = inPlan ? plannedOn(d) : [];
  const extras = sessionsOn(d).filter(s => !s.plannedId);
  const dia = DB.diary[d] || {};
  const isToday = d === todayISO();

  const planMin = plan.reduce((t,x) => t + x.min, 0);
  const doneToday = doneMin(sessionsOn(d));
  const pct = planMin ? Math.min(100, Math.round(doneToday/planMin*100)) : (doneToday ? 100 : 0);
  const ringCol = pct >= 100 ? "var(--ok)" : "var(--accent)";

  let h = '<div class="hero">'+
    '<div class="row" style="justify-content:space-between;gap:14px;align-items:flex-start">'+
      '<div style="min-width:0">'+
        '<div class="date">'+DOW[(dd.getDay()+6)%7]+' '+ddmm(dd)+'</div>'+
        '<div class="sub">'+(inPlan ? "Semana "+w+" de "+T+" · Fase "+ph.n+" "+ph.name : "Fuera de las "+T+" semanas del plan")+
          (inPlan && isDeload(w) ? ' · <b style="color:var(--warn)">semana de descarga</b>' : "")+'</div>'+
      '</div>'+
      (planMin ? '<div class="ring" style="background:conic-gradient('+ringCol+' '+(pct*3.6)+'deg,var(--surface-3) 0)">'+
        '<span class="num">'+pct+'%</span></div>' : "")+
    '</div>'+
    '<div class="row" style="gap:8px;margin-top:14px">'+
      '<button class="icon-btn" data-act="nav-day" data-delta="-1" aria-label="Día anterior">‹</button>'+
      '<button class="icon-btn" data-act="nav-day" data-delta="1" aria-label="Día siguiente">›</button>'+
      (isToday ? '<span class="pill acc">hoy</span>' : '<button class="btn sm" data-act="goto-today">Ir a hoy</button>')+
      '<div class="spacer"></div>'+
      (planMin ? '<span class="tiny t3 num">'+fmtHours(doneToday)+' de '+fmtHours(planMin)+'</span>' : "")+
    '</div></div>';

  h += coachPanel(coachAdvice());

  if(plan.length === 0 && inPlan) h += '<div class="card empty" style="margin-bottom:12px">Día de descanso. 😴</div>';
  if(!inPlan && !extras.length) h += '<div class="card empty" style="margin-bottom:12px">Aquí no hay nada planificado, pero puedes registrar lo que hayas entrenado.</div>';

  plan.forEach(pl => { h += sesCard(pl, sessionByPlanned(pl.id), d); });
  extras.forEach(s => { h += sesCard({id:s.id, type:s.type, subtype:s.subtype, title:s.title||TYPES[s.type].label,
                                      min:s.durationMin, note:"", unplanned:true}, s, d); });
  h += '<button class="btn block dash" data-act="add-unplanned" style="margin-top:4px;padding:13px">'+
       '+ Registrar un entreno que no estaba en el plan</button>';

  h += '<div class="sec" style="margin-top:22px"><h2>Diario del día</h2><div class="card pad">'+
    '<div class="grid3">'+
      '<label class="f"><span>Peso (kg)</span><input type="number" step="0.1" inputmode="decimal" data-act="diary" data-f="weightKg" value="'+(dia.weightKg??"")+'"></label>'+
      '<label class="f"><span>Sueño (h)</span><input type="number" step="0.25" inputmode="decimal" data-act="diary" data-f="sleepH" value="'+(dia.sleepH??"")+'"></label>'+
      '<label class="f"><span>Sensaciones</span><select data-act="diary" data-f="feel">'+
        '<option value="">—</option>'+[1,2,3,4,5].map(n=>'<option value="'+n+'"'+(String(dia.feel)===String(n)?" selected":"")+'>'+n+" "+["😵","😕","😐","🙂","💪"][n-1]+'</option>').join("")+
      '</select></label>'+
    '</div>'+
    '<label class="f" style="margin-bottom:0"><span>Notas del día</span><textarea data-act="diary" data-f="notes" placeholder="Cómo te has sentido, molestias, nutrición…">'+esc(dia.notes||"")+'</textarea></label>'+
  '</div></div>';
  return h;
}

/* --- marcar estado --- */
function hasMetrics(s){
  if(!s) return false;
  if(s.rpe || (s.notes||"").trim()) return true;
  for(const k of ["swim","bike","run","gym","brick"]){
    const o = s[k]; if(!o) continue;
    if(k === "gym") { if((o.exercises||[]).length) return true; continue; }
    if(k === "brick"){ if(JSON.stringify(o).match(/[1-9]/)) return true; continue; }
    if(Object.values(o).some(v => v !== null && v !== "" && v !== undefined)) return true;
  }
  return false;
}
function setStatus(dateISO, pid, st){
  const p = (DB.planned[dateISO]||[]).find(x => x.id === pid);
  if(!p) return;
  let s = sessionByPlanned(pid);
  if(s && s.status === st){
    if(hasMetrics(s) && !confirm("Esa sesión tiene métricas registradas. ¿Quitar el registro?")) return;
    DB.sessions = DB.sessions.filter(x => x.id !== s.id);
  } else if(s){
    s.status = st;
    if(st === "skipped") s.durationMin = 0;
    else if(!s.durationMin) s.durationMin = st === "partial" ? round5(p.min*0.5) : p.min;
  } else {
    DB.sessions.push(newSession({
      date:dateISO, plannedId:pid, type:p.type, subtype:p.subtype||null, title:p.title, status:st,
      durationMin: st === "skipped" ? 0 : (st === "partial" ? round5(p.min*0.5) : p.min)
    }));
  }
  save(); render();
}
function newSession(o){
  return Object.assign({ id:uid(), date:todayISO(), plannedId:null, type:"run", subtype:null, title:"",
    status:"done", durationMin:0, rpe:null, notes:"",
    swim:null, bike:null, run:null, gym:null, brick:null }, o);
}

/* =================== modal de métricas =================== */
function fieldNum(id,label,ph,step,val){
  return '<label class="f"><span>'+label+'</span><input type="number" inputmode="decimal" step="'+(step||"any")+'" id="'+id+'" placeholder="'+(ph||"")+'" value="'+(val??"")+'"></label>';
}
function fieldTxt(id,label,ph,val){
  return '<label class="f"><span>'+label+'</span><input type="text" id="'+id+'" placeholder="'+(ph||"")+'" value="'+esc(val??"")+'"></label>';
}
function rpeRow(val){
  let b = "";
  for(let i=1;i<=10;i++) b += '<button type="button" data-rpe="'+i+'" aria-pressed="'+(Number(val)===i)+'">'+i+'</button>';
  return '<label class="f"><span>RPE (esfuerzo percibido 1–10)</span><div class="rpe" id="f_rpe" data-val="'+(val||"")+'">'+b+'</div></label>';
}
function calcBox(items){
  return '<div class="calc" id="calcBox">'+items.map(i=>'<div><span>'+i[0]+'</span><b id="'+i[1]+'">—</b></div>').join("")+'</div>';
}

function openLog(dateISO, pid, sid){
  ensureDay(dateISO);
  const p = pid ? (DB.planned[dateISO]||[]).find(x => x.id === pid) : null;
  let s = sid ? sessionById(sid) : (pid ? sessionByPlanned(pid) : null);
  const isNew = !s;
  if(isNew){
    s = newSession({ date:dateISO, plannedId:pid||null, type:(p?p.type:"run"), subtype:(p?p.subtype:null),
                     title:(p?p.title:""), status:"done", durationMin:(p?p.min:0) });
  }
  const t = s.type;
  let body = "";
  if(!p) body += '<div class="grid2">'+
      '<label class="f"><span>Tipo</span><select id="f_type">'+TYPE_ORDER.map(k=>'<option value="'+k+'"'+(k===t?" selected":"")+'>'+TYPES[k].icon+" "+TYPES[k].label+'</option>').join("")+'</select></label>'+
      fieldTxt("f_title","Título","p. ej. Carrera suelta", s.title)+'</div>';

  body += '<div class="grid2">'+
    fieldNum("f_dur","Duración total (min)","0","1", s.durationMin||"")+
    '<label class="f"><span>Estado</span><select id="f_status">'+
      ['done|✓ Hecha','partial|~ Parcial','skipped|✕ Saltada'].map(o=>{const[v,l]=o.split("|");
        return '<option value="'+v+'"'+(s.status===v?" selected":"")+'>'+l+'</option>';}).join("")+
    '</select></label></div>';

  if(t === "swim"){
    const sw = s.swim||{};
    body += '<div class="grid2">'+
      fieldNum("f_dist","Distancia total (m)","1200","10", sw.distM??"")+
      fieldTxt("f_time","Tiempo nadando","32:10", sw.timeSec? fmtSec(sw.timeSec,"ms"):"")+'</div>'+
      calcBox([["Ritmo / 100 m","c_pace"]])+
      fieldNum("f_cont","Distancia continua máxima (m)","400","25", sw.contMaxM??"")+
      '<label class="f"><span>Series</span><textarea id="f_sets" placeholder="400 cal · 8×50 técnica r15 · 6×100 r20">'+esc(sw.sets||"")+'</textarea></label>'+
      '<label class="f"><span>Técnica y respiración</span><textarea id="f_tech" placeholder="Respiración bilateral cada 3, no me ahogo hasta el 6º largo…">'+esc(sw.techNotes||"")+'</textarea></label>';
  }
  if(t === "bike"){
    const b = s.bike||{};
    body += '<div class="grid2">'+
      fieldTxt("f_time","Tiempo","1:15:00", b.timeSec? fmtSec(b.timeSec,"hm"):"")+
      fieldNum("f_dist","Distancia (km)","35","0.1", b.distKm??"")+'</div>'+
      calcBox([["Velocidad media","c_spd"]])+
      '<div class="grid3">'+
        fieldNum("f_hr","FC media (ppm)","138","1", b.hrAvg??"")+
        fieldNum("f_pow","Potencia (W)","—","1", b.powAvg??"")+
        fieldNum("f_elev","Desnivel (m)","—","1", b.elevM??"")+'</div>';
  }
  if(t === "run"){
    const r = s.run||{};
    body += '<div class="grid2">'+
      fieldNum("f_dist","Distancia (km)","8","0.1", r.distKm??"")+
      fieldTxt("f_time","Tiempo","48:30", r.timeSec? fmtSec(r.timeSec):"")+'</div>'+
      calcBox([["Ritmo / km","c_pace"]])+
      fieldNum("f_hr","FC media (ppm)","145","1", r.hrAvg??"");
  }
  if(t === "brick"){
    const b = (s.brick&&s.brick.bike)||{}, r = (s.brick&&s.brick.run)||{};
    body += '<h3 style="color:var(--bike);font-size:13px;text-transform:uppercase;letter-spacing:.05em;margin:4px 0 8px">🚴 Tramo bici</h3>'+
      '<div class="grid3">'+
        fieldTxt("f_btime","Tiempo","1:30:00", b.timeSec? fmtSec(b.timeSec,"hm"):"")+
        fieldNum("f_bdist","Distancia (km)","42","0.1", b.distKm??"")+
        fieldNum("f_bhr","FC media","140","1", b.hrAvg??"")+'</div>'+
      calcBox([["Velocidad media","c_spd"]])+
      '<h3 style="color:var(--run);font-size:13px;text-transform:uppercase;letter-spacing:.05em;margin:12px 0 8px">🏃 Tramo carrera</h3>'+
      '<div class="grid3">'+
        fieldNum("f_rdist","Distancia (km)","4","0.1", r.distKm??"")+
        fieldTxt("f_rtime","Tiempo","22:00", r.timeSec? fmtSec(r.timeSec):"")+
        fieldNum("f_rhr","FC media","152","1", r.hrAvg??"")+'</div>'+
      calcBox([["Ritmo / km","c_pace"]]);
  }
  if(t === "gym"){
    const g = s.gym || {subtype:(s.subtype || (p&&p.subtype) || "Torso A"), exercises:[]};
    body += '<div class="grid2">'+
      '<label class="f"><span>Tipo de sesión</span><select id="f_sub">'+
        GYM_SUBTYPES.map(k=>'<option value="'+esc(k)+'"'+(g.subtype===k?" selected":"")+'>'+esc(k)+'</option>').join("")+
      '</select></label>'+
      '<label class="f"><span>&nbsp;</span><button type="button" class="btn block" id="f_recall">↺ Cargar última sesión</button></label>'+
    '</div>'+
    calcBox([["Volumen total","c_vol"],["Series","c_sets"]])+
    '<div id="exList"></div>'+
    '<button type="button" class="btn block" id="f_addex">+ Añadir ejercicio</button>'+
    '<div id="oneRM" class="tiny muted" style="margin-top:10px"></div>';
  }

  body += rpeRow(s.rpe) +
    '<label class="f"><span>Notas</span><textarea id="f_notes" placeholder="Sensaciones, material, incidencias…">'+esc(s.notes||"")+'</textarea></label>';

  const foot = (isNew ? "" : '<button class="btn danger" id="f_del">Borrar</button>')+
    '<button class="btn primary" id="f_save">Guardar</button>';
  const ovl = openModal(esc(s.title || TYPES[t].label) + " · " + ddmm(dateISO), body, foot);

  /* --- RPE --- */
  const rpeEl = ovl.querySelector("#f_rpe");
  if(rpeEl) rpeEl.addEventListener("click", e => {
    const b = e.target.closest("[data-rpe]"); if(!b) return;
    const v = b.dataset.rpe;
    const same = rpeEl.dataset.val === v;
    rpeEl.dataset.val = same ? "" : v;
    rpeEl.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(!same && x.dataset.rpe === v)));
  });

  /* --- gym: editor de ejercicios --- */
  let gymEx = t === "gym" ? JSON.parse(JSON.stringify((s.gym && s.gym.exercises) || [])) : [];
  let upBy = {};   /* ejercicio -> kg que te subo porque la última vez te sobró */
  function applyProgression(list){
    upBy = {};
    list.forEach(e => {
      const g = gymProgress(e);
      if(!g.up) return;
      upBy[e.name] = g.inc;
      e.sets = (e.sets||[]).map(st => ({ reps:st.reps, rir:"", kg: num(st.kg) ? num(st.kg)+g.inc : st.kg }));
    });
  }
  function readGym(){
    const list = ovl.querySelector("#exList"); if(!list) return;
    gymEx = [...list.querySelectorAll(".ex")].map(ex => {
      const rows = {};
      ex.querySelectorAll("input.setf").forEach(inp => {
        const j = inp.dataset.j;
        if(!rows[j]) rows[j] = {reps:"", kg:"", rir:""};
        if(inp.classList.contains("r"))      rows[j].reps = inp.value;
        else if(inp.classList.contains("k")) rows[j].kg   = inp.value;
        else                                  rows[j].rir  = inp.value;
      });
      return { name: ex.querySelector(".exname").value,
               sets: Object.keys(rows).sort((a,b)=>a-b).map(k => rows[k]) };
    });
  }
  function paintGym(){
    const list = ovl.querySelector("#exList"); if(!list) return;
    list.innerHTML = gymEx.map((ex,i) =>
      '<div class="ex" data-i="'+i+'">'+
        '<div class="exhead"><input type="text" class="exname" placeholder="Ejercicio" value="'+esc(ex.name||"")+'" list="exNames">'+
        '<button type="button" class="xbtn" data-delex="'+i+'" title="Quitar ejercicio">✕</button></div>'+
        '<div class="sets"><div class="h"></div><div class="h">Reps</div><div class="h">Kg</div><div class="h">RIR</div><div class="h"></div>'+
        (ex.sets||[]).map((st,j) =>
          '<div class="n">'+(j+1)+'</div>'+
          '<input type="number" inputmode="numeric" class="r setf" data-i="'+i+'" data-j="'+j+'" value="'+(st.reps??"")+'">'+
          '<input type="number" inputmode="decimal" step="0.5" class="k setf" data-i="'+i+'" data-j="'+j+'" value="'+(st.kg??"")+'">'+
          '<input type="number" inputmode="numeric" class="i setf" data-i="'+i+'" data-j="'+j+'" value="'+(st.rir??"")+'">'+
          '<button type="button" class="xbtn" data-delset="'+i+'-'+j+'">−</button>').join("")+
        '</div><button type="button" class="btn sm" data-addset="'+i+'" style="margin-top:8px">+ serie</button>'+
        (upBy[ex.name] ? '<span class="pill ok" style="margin-left:9px">↑ +'+esNum(upBy[ex.name],1).replace(",0","")+' kg</span>' : "")+
        '<span class="tiny t3" style="margin-left:9px" data-rm="'+i+'"></span>'+
      '</div>').join("");
    recalc();
  }
  if(t === "gym"){
    if(!gymEx.length){
      const sub = ovl.querySelector("#f_sub").value;
      gymEx = recallGym(sub) || (GYM_SEED[sub]||[]).map(n => ({name:n, sets:blankSets(3)}));
      applyProgression(gymEx);
    }
    paintGym();
    ovl.querySelector("#f_addex").addEventListener("click", () => {
      readGym(); gymEx.push({name:"", sets:[{reps:"",kg:"",rir:""}]}); paintGym();
    });
    ovl.querySelector("#f_recall").addEventListener("click", () => {
      const sub = ovl.querySelector("#f_sub").value;
      const mem = recallGym(sub);
      if(!mem){ toast("Aún no hay sesiones previas de "+sub); return; }
      gymEx = mem; applyProgression(gymEx); paintGym(); toast("Cargado de la última sesión de "+sub);
    });
    ovl.querySelector("#f_sub").addEventListener("change", e => {
      readGym();
      const empty = !gymEx.some(x => (x.sets||[]).some(st => st.kg || st.reps));
      if(empty){
        const sub = e.target.value;
        gymEx = recallGym(sub) || (GYM_SEED[sub]||[]).map(n => ({name:n, sets:blankSets(3)}));
        applyProgression(gymEx);
        paintGym();
      }
    });
    ovl.addEventListener("click", e => {
      const a = e.target.closest("[data-addset],[data-delset],[data-delex]"); if(!a) return;
      readGym();
      if(a.dataset.addset != null){ const i = +a.dataset.addset;
        const last = gymEx[i].sets[gymEx[i].sets.length-1] || {reps:"",kg:"",rir:""};
        gymEx[i].sets.push({reps:last.reps, kg:last.kg, rir:last.rir}); }
      else if(a.dataset.delset != null){ const [i,j] = a.dataset.delset.split("-").map(Number); gymEx[i].sets.splice(j,1); }
      else { gymEx.splice(+a.dataset.delex, 1); }
      paintGym();
    });
  }

  /* --- cálculos en vivo --- */
  function setCalc(id, txt){ const el = ovl.querySelector("#"+id); if(el) el.textContent = txt; }
  /* la duración se rellena sola con el tiempo del entreno mientras no la toques a mano */
  function autoDur(sec){
    const dur = ovl.querySelector("#f_dur");
    if(dur && sec > 0 && !dur.dataset.touched) dur.value = Math.round(sec/60);
  }
  function recalc(){
    if(t === "swim"){
      const d = num(ovl.querySelector("#f_dist").value), sec = parseTime(ovl.querySelector("#f_time").value);
      setCalc("c_pace", (d>0 && sec>0) ? fmtSec(sec/(d/100),"ms")+" /100 m" : "—");
      autoDur(sec);
    }
    if(t === "bike"){
      const d = num(ovl.querySelector("#f_dist").value), sec = parseTime(ovl.querySelector("#f_time").value);
      setCalc("c_spd", (d>0 && sec>0) ? esNum(d/(sec/3600))+" km/h" : "—");
      autoDur(sec);
    }
    if(t === "run"){
      const d = num(ovl.querySelector("#f_dist").value), sec = parseTime(ovl.querySelector("#f_time").value);
      setCalc("c_pace", (d>0 && sec>0) ? fmtSec(sec/d,"ms")+" /km" : "—");
      autoDur(sec);
    }
    if(t === "brick"){
      const bd = num(ovl.querySelector("#f_bdist").value), bs = parseTime(ovl.querySelector("#f_btime").value);
      const rd = num(ovl.querySelector("#f_rdist").value), rs = parseTime(ovl.querySelector("#f_rtime").value);
      setCalc("c_spd", (bd>0 && bs>0) ? esNum(bd/(bs/3600))+" km/h" : "—");
      setCalc("c_pace",(rd>0 && rs>0) ? fmtSec(rs/rd,"ms")+" /km" : "—");
      autoDur(bs + rs);
    }
    if(t === "gym"){
      readGym();
      const vol = gymVolume({exercises:gymEx});
      const nsets = gymEx.reduce((n,e) => n + (e.sets||[]).filter(st => num(st.reps)).length, 0);
      setCalc("c_vol", Math.round(vol).toLocaleString("es-ES")+" kg");
      setCalc("c_sets", String(nsets));
      gymEx.forEach((e,i) => {
        const el = ovl.querySelector('[data-rm="'+i+'"]');
        if(!el) return;
        const b = bestEpley(e);
        el.textContent = b ? "1RM est. " + esNum(b) + " kg" : "";
      });
    }
  }
  ovl.addEventListener("input", e => {
    if(e.target.id === "f_dur") e.target.dataset.touched = "1";
    recalc();
  });
  if(!isNew && s.durationMin) ovl.querySelector("#f_dur").dataset.touched = "1";
  recalc();

  /* --- guardar / borrar --- */
  ovl.querySelector("#f_save").addEventListener("click", () => {
    const g = id => { const el = ovl.querySelector("#"+id); return el ? el.value : ""; };
    if(!p){ s.type = g("f_type") || s.type; s.title = g("f_title") || TYPES[s.type].label; }
    s.durationMin = Math.round(num(g("f_dur")) || 0);
    s.status = g("f_status") || "done";
    s.rpe = num(rpeEl ? rpeEl.dataset.val : "") || null;
    s.notes = g("f_notes");
    s.swim = s.bike = s.run = s.gym = s.brick = null;
    if(s.type === "swim") s.swim = { distM:num(g("f_dist")), timeSec:parseTime(g("f_time"))||null,
                                     contMaxM:num(g("f_cont")), sets:g("f_sets"), techNotes:g("f_tech") };
    if(s.type === "bike") s.bike = { distKm:num(g("f_dist")), timeSec:parseTime(g("f_time"))||null,
                                     hrAvg:num(g("f_hr")), powAvg:num(g("f_pow")), elevM:num(g("f_elev")) };
    if(s.type === "run")  s.run  = { distKm:num(g("f_dist")), timeSec:parseTime(g("f_time"))||null, hrAvg:num(g("f_hr")) };
    if(s.type === "brick")s.brick= { bike:{distKm:num(g("f_bdist")), timeSec:parseTime(g("f_btime"))||null, hrAvg:num(g("f_bhr"))},
                                     run :{distKm:num(g("f_rdist")), timeSec:parseTime(g("f_rtime"))||null, hrAvg:num(g("f_rhr"))} };
    if(s.type === "gym"){
      readGym();
      const ex = gymEx.filter(e => (e.name||"").trim()).map(e => ({
        name:e.name.trim(),
        sets:(e.sets||[]).filter(st => num(st.reps) || num(st.kg))
                         .map(st => ({reps:num(st.reps), kg:num(st.kg), rir:num(st.rir)}))
      }));
      s.subtype = g("f_sub");
      s.gym = { subtype:s.subtype, exercises:ex };
      if(ex.length) DB.exerciseMemory[s.subtype] = JSON.parse(JSON.stringify(ex));
    }
    if(s.durationMin === 0 && s.status !== "skipped" && p) s.durationMin = p.min;
    if(isNew) DB.sessions.push(s);
    save(); closeModal(); render(); toast("Guardado ✓");
  });
  const del = ovl.querySelector("#f_del");
  if(del) del.addEventListener("click", () => {
    if(!confirm("¿Borrar este registro?")) return;
    DB.sessions = DB.sessions.filter(x => x.id !== s.id);
    save(); closeModal(); render(); toast("Registro borrado");
  });
}
function blankSets(n){ return Array.from({length:n||3}, () => ({reps:"", kg:"", rir:""})); }
function withSets(arr){
  return (arr||[]).map(e => ({ name:e.name, sets:(e.sets && e.sets.length) ? e.sets.map(st=>({reps:st.reps,kg:st.kg,rir:st.rir})) : blankSets(3) }));
}
function recallGym(subtype){
  const last = [...DB.sessions].filter(s => s.type === "gym" && s.gym && s.gym.subtype === subtype && (s.gym.exercises||[]).length)
    .sort((a,b) => a.date < b.date ? 1 : -1)[0];
  if(last) return withSets(last.gym.exercises);
  const mem = DB.exerciseMemory[subtype];
  return mem ? withSets(mem) : null;
}

/* =================== vista SEMANA =================== */
function stackBar(byType, totalRef){
  const tot = Math.max(totalRef||0, TYPE_ORDER.reduce((t,k)=>t+byType[k],0), 1);
  return '<div class="stack">'+TYPE_ORDER.filter(k=>byType[k]>0)
    .map(k=>'<i style="width:'+(byType[k]/tot*100).toFixed(1)+'%;background:var(--'+k+')"></i>').join("")+'</div>';
}
function viewWeek(){
  const T = totalWeeks();
  if(state.week == null) state.week = Math.min(T, Math.max(1, weekIndexOf(new Date())));
  const w = state.week;
  ensureWeek(w);
  const p = phaseOfWeek(w), ws = weekStart(w);
  const sess = sessionsInWeek(w), by = minutesByType(sess);
  const done = doneMin(sess), target = weekTargetMin(w), plannedM = plannedMinWeek(w);
  const pct = plannedM ? Math.round(done/plannedM*100) : 0;

  let h = '<div class="sec"><div class="row wrap" style="justify-content:space-between;margin-bottom:12px">'+
    '<div class="row" style="gap:6px">'+
      '<button class="icon-btn" data-act="nav-week" data-delta="-1" '+(w<=1?"disabled":"")+'>‹</button>'+
      '<div style="min-width:170px;text-align:center">'+
        '<div style="font-weight:700;font-size:16px">Semana '+w+' <span class="muted" style="font-weight:500">de '+T+'</span></div>'+
        '<div class="tiny muted">'+ddmm(ws)+' – '+ddmm(weekEnd(w))+' · Fase '+p.n+' '+p.name+'</div>'+
      '</div>'+
      '<button class="icon-btn" data-act="nav-week" data-delta="1" '+(w>=T?"disabled":"")+'>›</button>'+
    '</div>'+
    '<div class="row" style="gap:6px">'+
      (isDeload(w) ? '<span class="pill deload">⬇ descarga −'+Math.round((DB.settings.deloadPct??.35)*100)+'%</span>' : "")+
      (p.n===4 ? '<span class="pill">taper</span>' : "")+
      '<button class="btn sm" data-act="regen-week" data-w="'+w+'" title="Volver a generar desde la plantilla de la fase">↺ Plantilla</button>'+
    '</div></div>';

  h += '<div class="card" style="padding:13px;margin-bottom:14px">'+
    '<div class="row wrap" style="justify-content:space-between;align-items:baseline">'+
      '<div><b class="num" style="font-size:22px">'+fmtHours(done)+'</b> '+
        '<span class="muted tiny">hechas de '+fmtHours(plannedM)+' planificadas</span></div>'+
      '<div class="tiny muted">objetivo de fase <b class="num">'+fmtHours(target)+'</b></div>'+
    '</div>'+
    '<div style="margin:9px 0 7px">'+stackBar(by, Math.max(plannedM,target))+'</div>'+
    '<div class="legend">'+TYPE_ORDER.filter(k=>by[k]>0).map(k=>
      '<span><i style="background:var(--'+k+')"></i>'+TYPES[k].label+' <b class="num">'+fmtHours(by[k])+'</b></span>').join("")+
      (done?"":'<span class="muted">Sin sesiones registradas todavía</span>')+
    '</div>'+
    '<div class="tiny muted" style="margin-top:7px">Cumplimiento <b class="num" style="color:'+(pct>=90?"var(--ok)":pct>=70?"var(--warn)":"var(--text-2)")+'">'+pct+'%</b> · '+esc(p.desc)+'</div>'+
  '</div>';

  const futura = iso(weekStart(w)) > todayISO();
  const cf = coachFactor(futura ? w : w+1);
  h += coachPanel(cf.why, futura ? "Ajuste aplicado a esta semana" : "Ajuste para la semana que viene");

  h += '<div class="wk">';
  for(let i=0;i<7;i++){
    const dISO = iso(addDays(ws,i)), plan = DB.planned[dISO]||[];
    const extras = sessionsOn(dISO).filter(s => !s.plannedId);
    const isT = dISO === todayISO();
    h += '<div class="day'+(isT?" today":"")+'" data-act="open-day" data-date="'+dISO+'">'+
      '<h4><span>'+DOW_S[i]+'</span><b>'+ddmm(dISO)+'</b></h4><div class="mini-wrap">';
    if(!plan.length && !extras.length) h += '<div class="tiny muted">Descanso</div>';
    plan.forEach(pl => {
      const s = sessionByPlanned(pl.id);
      const cls = s ? (s.status==="skipped" ? "skipped" : "done") : "";
      h += '<div class="mini '+TYPES[pl.type].css+' '+cls+'"><div class="t">'+esc(pl.title)+'</div>'+
           '<div class="num" style="opacity:.75">'+pl.min+'′'+(s&&s.durationMin&&s.status!=="skipped"&&s.durationMin!==pl.min?" → "+s.durationMin+"′":"")+'</div></div>';
    });
    extras.forEach(s => {
      h += '<div class="mini '+TYPES[s.type].css+' done"><div class="t">'+esc(s.title||TYPES[s.type].label)+'</div>'+
           '<div class="num" style="opacity:.75">extra · '+(s.durationMin||0)+'′</div></div>';
    });
    h += '</div></div>';
  }
  h += '</div></div>';
  return h;
}

        '<th>#</th><th>Fechas</th><th>Objetivo</th><th>Hecho</th><th style="width:34%">Cumplimiento</th></tr></thead><tbody>';
    for(let w=p.from; w<=p.to; w++){
      const target = weekTargetMin(w), plannedM = plannedMinWeek(w);
      const done = doneMin(sessionsInWeek(w));
      const pct = plannedM ? Math.min(150, Math.round(done/plannedM*100)) : 0;
      const col = pct>=90?"var(--ok)":pct>=70?"var(--warn)":pct>0?"var(--text-2)":"var(--line)";
      h += '<tr class="'+(w===cur?"cur":"")+'" data-act="open-week" data-w="'+w+'">'+
        '<td class="wn num">'+w+'</td>'+

          (isDeload(w)?' <span class="pill deload">descarga</span>':"")+'</td>'+

  });
  return h + '</div>';
}
